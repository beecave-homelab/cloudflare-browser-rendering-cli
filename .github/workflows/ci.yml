name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDM
        run: pip install --no-cache-dir pdm

      - name: Install dependencies (runtime + dev)
        run: pdm install -G dev --no-editable --frozen-lockfile

      - name: Lint (ruff check .)
        run: pdm run ruff check .
      
      - name: Format all maintained Python files
        run: pdm run ruff format --check cloudflare_browser_render tests scripts

      - name: Run tests (pytest -q)
        run: pdm run pytest -q

      - name: Lint (pylint cloudflare_browser_render/)
        timeout-minutes: 5
        run: pdm run pylint cloudflare_browser_render/

      - name: Lint (pylint tests/)
        timeout-minutes: 5
        run: >-
          pdm run pylint
          --disable=missing-module-docstring,missing-function-docstring
          tests/
